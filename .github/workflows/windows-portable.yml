name: Windows portable application

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "print_manager.py"
      - "print_core.py"
      - "pcl_capture.py"
      - "pcl_capture_ui.py"
      - "scripts/**"
      - "docs/**"
      - "cprot_ui.py"
      - "requirements.txt"
      - ".github/workflows/windows-portable.yml"

jobs:
  build-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
      - name: Install dependencies and builder
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pyinstaller>=6.10,<7"
      - name: Verify imports and compile
        run: |
          python -m py_compile print_manager.py print_core.py cprot_ui.py pcl_capture.py pcl_capture_ui.py
          python -c "import print_manager, cprot_ui, pcl_capture, pcl_capture_ui"
      - name: Build portable application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name CPROT-QRS-Card --collect-all ttkbootstrap --hidden-import win32timezone --hidden-import pcl_capture_ui --hidden-import pcl_capture print_manager.py
          if (-not (Test-Path "dist/CPROT-QRS-Card/CPROT-QRS-Card.exe")) { throw "No se generó el ejecutable Windows" }
      - name: Include readme
        shell: pwsh
        run: |
          Copy-Item README.md "dist/CPROT-QRS-Card/LEEME.md"
          New-Item -ItemType Directory -Force -Path "dist/CPROT-QRS-Card/scripts" | Out-Null
          Copy-Item scripts/*.ps1 "dist/CPROT-QRS-Card/scripts/"
          New-Item -ItemType Directory -Force -Path "dist/CPROT-QRS-Card/docs" | Out-Null
          Copy-Item docs/DISENO_CAPTURA_NATIVA_QRS.md "dist/CPROT-QRS-Card/docs/"
      - name: Upload Windows portable build
        uses: actions/upload-artifact@v4
        with:
          name: CPROT-QRS-Card-Windows-x64
          path: dist/CPROT-QRS-Card/
          if-no-files-found: error
          retention-days: 14
