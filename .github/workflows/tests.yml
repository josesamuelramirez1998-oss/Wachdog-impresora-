name: Core tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile source
        run: python -m py_compile print_core.py print_manager.py
      - name: Run cross-platform logic tests
        run: python -m unittest discover -s tests -v
